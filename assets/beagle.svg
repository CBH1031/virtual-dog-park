<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-labelledby="title-beagle">
  <title id="title-beagle">Illustration of a Beagle</title>

  <defs>
    <!-- everything inside this shape is trimmed to the outline of the head -->
    <clipPath id="beagle-head">
      <ellipse cx="100" cy="96" rx="45" ry="43" />
    </clipPath>
  </defs>

  <!-- background badge -->
  <circle cx="100" cy="100" r="94" fill="#FDF1DC" />

  <!-- long droopy ears, drawn first so the head covers their tops -->
  <ellipse cx="52" cy="120" rx="18" ry="36" fill="#8A5A32" />
  <ellipse cx="148" cy="120" rx="18" ry="36" fill="#8A5A32" />

  <!-- head -->
  <ellipse cx="100" cy="96" rx="45" ry="43" fill="#F8EFE3" />

  <!-- tricolour marking: brown cap over the eyes, white blaze down the middle -->
  <g clip-path="url(#beagle-head)">
    <ellipse cx="100" cy="68" rx="48" ry="33" fill="#A9702F" />
    <rect x="91" y="30" width="18" height="76" rx="9" fill="#F8EFE3" />
  </g>

  <!-- muzzle -->
  <ellipse cx="100" cy="126" rx="29" ry="21" fill="#FFFDF8" />

  <!-- nose and mouth -->
  <ellipse cx="100" cy="115" rx="11" ry="8.5" fill="#2B2622" />
  <path d="M100 123 v7" fill="none" stroke="#C9B7A5" stroke-width="2.5" stroke-linecap="round" />
  <path d="M100 130 q-9 6 -16 0" fill="none" stroke="#C9B7A5" stroke-width="2.5" stroke-linecap="round" />
  <path d="M100 130 q9 6 16 0" fill="none" stroke="#C9B7A5" stroke-width="2.5" stroke-linecap="round" />

  <!-- eyes -->
  <circle cx="84" cy="88" r="6.5" fill="#241E1B" />
  <circle cx="116" cy="88" r="6.5" fill="#241E1B" />
  <circle cx="86" cy="86" r="2" fill="#FFFFFF" />
  <circle cx="118" cy="86" r="2" fill="#FFFFFF" />
</svg>
